type: "orchestration"
version: "1.0"
pipeline:
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "SQL Script"
      parameters:
        componentName: "Start"
    SQL Script:
      type: "sql-executor"
      transitions:
        success:
        - "File Iterator"
      parameters:
        componentName: "SQL Script"
        scriptLocation: "Component"
        declareSqlVariables: "Include selected"
        variablesToInclude:
        - "filename_bnk"
        sqlScript: "CREATE OR REPLACE TABLE TRANSACTIONS(\r\ntrans_id INT,\t\r\naccount_id\t\
          INT,\r\nDate  DATE,\r\nType\tVARCHAR(30),\r\noperation\tVARCHAR(40),\r\n\
          amount\tINT,\r\nbalance\tFLOAT,\r\nPurpose\tVARCHAR(70),\r\nbank\tVARCHAR(45)\r\
          \n);"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    S3 Load:
      type: "s3-load"
      parameters:
        componentName: "S3 Load"
        stage: "[Custom]"
        authentication: "Credentials"
        s3ObjectPrefix: "s3://transactionnew/transactions/${filename}"
        pattern: ".*\\.csv"
        encryption: "S3 Encryption"
        warehouse: "[Environment Default]"
        database: "[Environment Default]"
        schema: "[Environment Default]"
        targetTable: "TRANSACTIONS"
        loadColumns:
        - "TRANS_ID"
        - "ACCOUNT_ID"
        - "DATE"
        - "TYPE"
        - "OPERATION"
        - "AMOUNT"
        - "BALANCE"
        - "PURPOSE"
        - "BANK"
        format: "[Custom]"
        fileType: "CSV"
        compression: "AUTO"
        recordDelimiter:
        fieldDelimiter: ","
        skipHeader: "1"
        skipBlankLines: "False"
        dateFormat:
        timeFormat:
        timestampFormat:
        escape:
        escapeUnenclosedField:
        trimSpace: "False"
        fieldOptionallyEnclosed:
        nullIf:
        errorOnColumnCountMismatch: "False"
        emptyFieldAsNull: "True"
        replaceInvalidCharacters: "False"
        encodingType:
        onError: "Abort Statement"
        sizeLimitB:
        purgeFiles: "False"
        truncateColumns: "False"
        forceLoad: "False"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
    File Iterator:
      type: "file-iterator"
      iterationTarget: "S3 Load"
      parameters:
        componentName: "File Iterator"
        inputDataType: "S3"
        maxIterations: "25"
        filterRegex: ".*\\.csv"
        concurrency: "Sequential"
        variables:
        - - "filename"
          - "Filename"
        breakOnFailure: "No"
        inputDataUrl1: "s3://transactionnew/transactions"
      postProcessing:
        updateOutputMessage:
        updateScalarVariables:
  variables:
    filename:
      metadata:
        type: "TEXT"
        description: ""
        scope: "SHARED"
        visibility: "PUBLIC"
      defaultValue: "trnx_16"
design:
  components:
    Start:
      position:
        x: -540
        "y": -50
      tempMetlId: 1
    SQL Script:
      position:
        x: -380
        "y": -50
      tempMetlId: 2
    S3 Load:
      position:
        x: -220
        "y": -70
      tempMetlId: 3
    File Iterator:
      position:
        x: -220
        "y": -70
      tempMetlId: 4
